services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      FLASK_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set true when served over HTTPS
    volumes:
      - app-data:/data        # SQLite DBs, Chroma index, uploads, sessions
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
